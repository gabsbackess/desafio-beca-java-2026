spring.application.name=transactions
server.port=8082

# Fuso usado para o "dia" do limite diario e das analises (e nao o fuso do servidor)
app.timezone=${APP_TIMEZONE:America/Sao_Paulo}

# Banco de transações (PostgreSQL). Valores vêm de variáveis de ambiente (ver .env.example).
spring.datasource.url=jdbc:postgresql://localhost:5434/${TRANSACTIONS_DB_NAME}
spring.datasource.username=${TRANSACTIONS_DB_USER}
spring.datasource.password=${TRANSACTIONS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# API Mock (MockAPI.io): URL base do projeto, por exemplo https://xxxx.mockapi.io/api/v1
mockapi.url=${MOCKAPI_URL:http://localhost:9}
mockapi.connect-timeout-ms=2000
mockapi.read-timeout-ms=3000

# Serviço de usuários (MS1), usado para validar e-mail e senha e para conferir o destino de transferências.
# No Compose: http://users:8081
users.url=${USERS_URL:http://localhost:8081}
users.connect-timeout-ms=2000
users.read-timeout-ms=3000
