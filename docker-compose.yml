services:
  #configuração primeiro db;
  users-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  #configuração segundo db;
  transactions-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${TRANSACTIONS_DB_NAME}
      POSTGRES_USER: ${TRANSACTIONS_DB_USER}
      POSTGRES_PASSWORD: ${TRANSACTIONS_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - transactions-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRANSACTIONS_DB_USER} -d ${TRANSACTIONS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Microsserviço de usuários
  users:
    build:
      context: ./users
      dockerfile: Dockerfile
    container_name: users-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://users-db:5432/${USER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
    depends_on:
      users-db:
        condition: service_healthy
    restart: on-failure

volumes:
  users-db-data:
  transactions-db-data: