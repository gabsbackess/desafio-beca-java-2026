spring.application.name=users
spring.datasource.url=jdbc:postgresql://localhost:5433/${USER_DB_NAME}
spring.datasource.username=${USER_DB_USER}
spring.datasource.password=${USER_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
server.port=8081
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Chave usada pelo MS2 para consultar GET /users/{id} (comunicação entre serviços).
# Vem do ambiente (INTERNAL_API_KEY); vazia = acesso entre serviços desligado.
security.internal-key=${INTERNAL_API_KEY:}
